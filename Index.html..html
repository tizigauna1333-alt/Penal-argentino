<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Penal Argentino — Prototipo 0.1</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06110d;font-family:Arial,sans-serif;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  #help{position:fixed;left:50%;top:12px;transform:translateX(-50%);color:#fff;background:#0009;padding:8px 14px;border-radius:14px;font-size:12px;text-align:center;pointer-events:none}
  #restart{position:fixed;right:14px;top:14px;border:1px solid #fff8;background:#07100dcc;color:#fff;border-radius:14px;padding:9px 12px;font-weight:700}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="help">ARRASTRÁ EN EL CÍRCULO PARA APUNTAR · TOCÁ PATEAR</div>
<button id="restart">↻ Reiniciar</button>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W,H,dpr;
const state={aimX:0.5,aimY:0.45,power:0.68,shooting:false,result:"",t:0,ballT:0};
let ball={x:.5,y:.78,z:0}, keeper={x:.5,y:.39};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

function lerp(a,b,t){return a+(b-a)*t}
function draw(){
  ctx.clearRect(0,0,W,H);
  // sky
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#07152a");g.addColorStop(.55,"#102b23");g.addColorStop(1,"#07150e");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // lights
  ctx.fillStyle="#fff"; for(let x of [.12,.5,.88]){ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(W*x,65,5,0,7);ctx.fill()}ctx.globalAlpha=1;
  // crowd
  ctx.fillStyle="#15252b";ctx.fillRect(0,105,W,95);
  for(let i=0;i<90;i++){ctx.fillStyle=i%3?"#b8d7df":"#79a9b5";ctx.fillRect((i*73)%W,115+(i%7)*10,3,6)}
  // pitch perspective
  ctx.fillStyle="#17633a";ctx.beginPath();ctx.moveTo(W*.06, H);ctx.lineTo(W*.94,H);ctx.lineTo(W*.72,H*.34);ctx.lineTo(W*.28,H*.34);ctx.closePath();ctx.fill();
  ctx.strokeStyle="#d9f0df";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W*.06,H);ctx.lineTo(W*.94,H);ctx.moveTo(W*.28,H*.34);ctx.lineTo(W*.72,H*.34);ctx.stroke();
  // goal
  const gx=W*.22, gy=H*.27, gw=W*.56, gh=H*.27;
  ctx.fillStyle="#0d1820";ctx.fillRect(gx,gy,gw,gh);
  ctx.strokeStyle="#eee";ctx.lineWidth=6;ctx.strokeRect(gx,gy,gw,gh);
  ctx.strokeStyle="#ffffff44";ctx.lineWidth=1;
  for(let i=1;i<10;i++){let x=gx+gw*i/10;ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x,gy+gh);ctx.stroke()}
  for(let i=1;i<5;i++){let y=gy+gh*i/5;ctx.beginPath();ctx.moveTo(gx,y);ctx.lineTo(gx+gw,y);ctx.stroke()}
  // keeper
  const kx=W*keeper.x, ky=H*keeper.y;
  ctx.fillStyle="#111";ctx.beginPath();ctx.arc(kx,ky-35,15,0,7);ctx.fill();
  ctx.fillRect(kx-13,ky-20,26,45);
  ctx.strokeStyle="#ddd";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(kx-12,ky-12);ctx.lineTo(kx-30,ky+8);ctx.moveTo(kx+12,ky-12);ctx.lineTo(kx+30,ky+8);ctx.stroke();
  ctx.fillStyle="#ddd";ctx.beginPath();ctx.arc(kx-31,ky+9,6,0,7);ctx.arc(kx+31,ky+9,6,0,7);ctx.fill();
  // aim target
  if(!state.shooting){
    const tx=lerp(W*.30,W*.70,state.aimX), ty=lerp(H*.34,H*.54,state.aimY);
    ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.beginPath();ctx.arc(tx,ty,14,0,7);ctx.stroke();
    ctx.beginPath();ctx.moveTo(tx-22,ty);ctx.lineTo(tx+22,ty);ctx.moveTo(tx,ty-22);ctx.lineTo(tx,ty+22);ctx.stroke();
  }
  // ball
  const bx=W*ball.x, by=H*ball.y-ball.z;
  ctx.fillStyle="#0005";ctx.beginPath();ctx.ellipse(bx, H*ball.y+7, 13,5,0,0,7);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(bx,by,12,0,7);ctx.fill();
  ctx.fillStyle="#222";ctx.beginPath();ctx.arc(bx-3,by-2,4,0,7);ctx.fill();
  // player
  if(!state.shooting){
    ctx.fillStyle="#111";ctx.beginPath();ctx.arc(W*.5,H*.79,18,0,7);ctx.fill();
    ctx.fillStyle="#b7d8e7";ctx.fillRect(W*.5-22,H*.81,44,55);
    ctx.fillStyle="#111";ctx.fillRect(W*.5-22,H*.86,44,9);
  }
  // HUD
  ctx.fillStyle="#fff";ctx.font="900 22px Arial";ctx.fillText("PENAL ARGENTINO",18,34);
  ctx.font="700 12px Arial";ctx.fillText("PROTOTIPO 0.1",20,52);
  // aim control
  const cx=W*.16, cy=H*.78, r=58;
  ctx.fillStyle="#0009";ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();
  ctx.strokeStyle="#fff8";ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(cx+(state.aimX-.5)*80,cy+(state.aimY-.5)*80,15,0,7);ctx.fill();
  // power
  const pw=W*.28, ph=22, px=W*.60, py=H*.88;
  let pg=ctx.createLinearGradient(px,0,px+pw,0);pg.addColorStop(0,"#e33");pg.addColorStop(.55,"#f4c33d");pg.addColorStop(1,"#39c76b");
  ctx.fillStyle="#000b";ctx.fillRect(px,py,pw,ph);ctx.fillStyle=pg;ctx.fillRect(px,py,pw*state.power,ph);
  ctx.strokeStyle="#fff";ctx.strokeRect(px,py,pw,ph);
  ctx.fillStyle="#fff";ctx.font="700 12px Arial";ctx.fillText("POTENCIA",px,py-8);
  // kick
  const kx2=W*.5, ky2=H*.90;
  ctx.fillStyle="#07100eee";ctx.beginPath();ctx.arc(kx2,ky2,52,0,7);ctx.fill();
  ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle="#fff";ctx.font="900 14px Arial";ctx.textAlign="center";ctx.fillText("PATEAR",kx2,ky2+6);ctx.textAlign="left";
  if(state.result){
    ctx.fillStyle="#000b";ctx.fillRect(0,H*.42,W,80);
    ctx.fillStyle="#fff";ctx.font="900 34px Arial";ctx.textAlign="center";ctx.fillText(state.result,W/2,H*.49);ctx.textAlign="left";
  }
}
function kick(){
  if(state.shooting)return;
  state.shooting=true;state.result="";state.t=0;state.ballT=0;
  const targetX=lerp(.30,.70,state.aimX), targetY=lerp(.34,.54,state.aimY);
  const hitChance=Math.abs(targetX-keeper.x)<.09 && Math.abs(targetY-.42)<.12;
  const saved=hitChance && Math.random()<.72;
  const start={x:.5,y:.78};
  const duration=620;
  const startTime=performance.now();
  function anim(now){
    const p=Math.min((now-startTime)/duration,1), e=1-Math.pow(1-p,2);
    ball.x=lerp(start.x,targetX,e);ball.y=lerp(start.y,targetY,e);
    ball.z=Math.sin(Math.PI*p)*(120+160*state.power);
    if(saved) keeper.x=lerp(.5,targetX,Math.min(p*1.7,1));
    draw();
    if(p<1)requestAnimationFrame(anim);else{
      state.result=saved?"¡ATAJADA! 🧤":"¡GOOOOOL! ⚽";
      setTimeout(()=>{state.shooting=false;ball={x:.5,y:.78,z:0};keeper={x:.5,y:.39};draw()},1100);
    }
  }requestAnimationFrame(anim);
}
function pointerPos(e){
  const t=e.touches?e.touches[0]:e; return {x:t.clientX,y:t.clientY};
}
let drag=null;
c.addEventListener("pointerdown",e=>{drag=pointerPos(e)});
c.addEventListener("pointermove",e=>{
  if(!drag||state.shooting)return;
  const p=pointerPos(e),cx=W*.16,cy=H*.78;
  if(Math.hypot(p.x-cx,p.y-cy)<100){state.aimX=Math.max(0,Math.min(1,(p.x-(cx-58))/116));state.aimY=Math.max(0,Math.min(1,(p.y-(cy-58))/116));draw()}
});
c.addEventListener("pointerup",()=>drag=null);
c.addEventListener("pointercancel",()=>drag=null);
c.addEventListener("click",e=>{
  const p={x:e.clientX,y:e.clientY},px=W*.60,py=H*.88,pw=W*.28;
  const kx=W*.5,ky=H*.90;
  if(Math.hypot(p.x-kx,p.y-ky)<65)kick();
  else if(p.x>=px&&p.x<=px+pw&&p.y>=py-20&&p.y<=py+40){
    state.power=Math.max(0,Math.min(1,(p.x-px)/pw));draw();
  }
});
document.getElementById("restart").onclick=()=>{state.shooting=false;state.result="";state.aimX=.5;state.aimY=.45;state.power=.68;ball={x:.5,y:.78,z:0};keeper={x:.5,y:.39};draw()};
draw();
</script>
</body>
</html>
